<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="Amrut SalesTrack — Field Sales Tracking for Amrut Biochem. Track dealer visits, collections, and outstanding balances." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Amrut SalesTrack</title>
  </head>
  <body class="bg-gray-50 font-sans antialiased">
    <!-- Cache & SW Cleanup: Unregister service workers and purge all cached assets -->
    <script>
      (function() {
        // 1. Unregister all service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            var hadSW = false;
            registrations.forEach(function(registration) {
              registration.unregister();
              hadSW = true;
              console.log('[CacheBust] Unregistered service worker:', registration.scope);
            });
            // 2. Purge all CacheStorage entries (workbox precache, runtime, etc.)
            if ('caches' in window) {
              caches.keys().then(function(cacheNames) {
                cacheNames.forEach(function(cacheName) {
                  caches.delete(cacheName);
                  console.log('[CacheBust] Deleted cache:', cacheName);
                });
                // Only reload once if we actually cleaned something up
                if (hadSW || cacheNames.length > 0) {
                  // Use a flag in sessionStorage to avoid reload loops
                  if (!sessionStorage.getItem('cache_busted')) {
                    sessionStorage.setItem('cache_busted', '1');
                    window.location.reload();
                  }
                }
              });
            }
          });
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
